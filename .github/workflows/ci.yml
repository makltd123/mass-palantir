name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Линтер
        run: ruff check .

      - name: Тесты
        run: pytest

      - name: Сквозной прогон на «грязных» данных без LLM
        run: |
          mkdir -p "$RUNNER_TEMP/demo"
          python generate_dirty_data.py --out-dir "$RUNNER_TEMP/demo"
          python ontology_builder_v3.py --data-dir "$RUNNER_TEMP/demo" --no-llm
